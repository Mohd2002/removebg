<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERASE — Background Remover (Secure)</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #111118; --accent: #c8f135; --accent2: #7c6dfa;
            --text: #f0f0f5; --muted: #6b6b80; --border: rgba(255,255,255,0.07);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
        
        /* Nav & Layout */
        nav { display: flex; justify-content: space-between; padding: 1.2rem 2.5rem; background: rgba(10,10,15,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--accent); letter-spacing: 0.15em; }
        
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6rem 1.5rem; }
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 10vw, 8rem); line-height: 0.9; text-align: center; margin-bottom: 2rem; }
        
        /* Card & Upload */
        .card { width: 100%; max-width: 600px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2rem; }
        .upload-zone { border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; padding: 3rem 1rem; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-zone:hover { border-color: var(--accent); background: rgba(200,241,53,0.02); }
        #preview { width: 100%; max-height: 250px; object-fit: contain; margin-top: 1.5rem; display: none; border-radius: 10px; }

        /* Loader */
        .processing-bar { display: none; margin-top: 1.5rem; }
        .bar-track { height: 4px; background: #1a1a24; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .bar-fill { height: 100%; width: 30%; background: var(--accent); animation: loading 1.5s infinite linear; }
        @keyframes loading { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

        /* Results */
        .result-section { display: none; margin-top: 1.5rem; text-align: center; }
        #resultImage { width: 100%; background: repeating-conic-gradient(#ffffff0d 0% 25%, transparent 0% 50%) 0 0 / 20px 20px; border-radius: 12px; border: 1px solid var(--border); }
        .btn { width: 100%; padding: 1rem; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-ghost { background: #1a1a24; color: #fff; }
    </style>
</head>
<body>

    <nav><div class="logo">ERA<span>SE</span></div></nav>

    <section class="hero">
        <h1>REMOVE <span style="color: var(--accent);">BG</span> FAST</h1>
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/*" style="display:none">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">☁️</div>
                <p style="font-weight: 500;">Click or drag image here</p>
                <p style="font-size: 0.8rem; color: var(--muted); margin-top: 5px;">Supports PNG, JPG (Safe Mode)</p>
                <img id="preview">
            </div>

            <div class="processing-bar" id="processingBar">
                <p style="font-size: 0.8rem; color: var(--accent);">AI is working...</p>
                <div class="bar-track"><div class="bar-fill"></div></div>
            </div>

            <div class="result-section" id="resultSection">
                <img id="resultImage">
                <button class="btn btn-primary" onclick="downloadImage()">Download PNG</button>
                <button class="btn btn-ghost" onclick="location.reload()">Upload New</button>
            </div>
        </div>
    </section>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const processingBar = document.getElementById('processingBar');
        const resultSection = document.getElementById('resultSection');
        const resultImage = document.getElementById('resultImage');
        const preview = document.getElementById('preview');
        let finalBlobUrl = null;

        uploadZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                // Show preview
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                startProcessing(file);
            }
        };

        async function startProcessing(file) {
            uploadZone.style.pointerEvents = 'none';
            processingBar.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);

            try {
                // Ab hum remove.bg ko nahi, apne proxy.php ko call karenge
                const response = await fetch('proxy.php', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('API Error');

                const blob = await response.blob();
                finalBlobUrl = URL.createObjectURL(blob);
                
                resultImage.src = finalBlobUrl;
                uploadZone.style.display = 'none';
                processingBar.style.display = 'none';
                resultSection.style.display = 'block';

            } catch (err) {
                alert("Processing failed. Check if proxy.php is uploaded.");
                location.reload();
            }
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = finalBlobUrl;
            link.download = 'erased_image.png';
            link.click();
        }
    </script>
</body>
</html>
